<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173b34" />
    <title>Fältskytte-timer</title>
  </head>
  <body>
    <main class="page">
      <section class="timer-card" aria-labelledby="app-title">
        <header class="app-header">
          <p class="eyebrow">Fast mål</p>
          <h1 id="app-title">Fältskytte-timer</h1>
          <p class="intro">Ställ in skjuttiden för stationen.</p>
        </header>

        <div class="setting">
          <label for="shooting-time">Skjuttid</label>
          <div class="time-input">
            <input id="shooting-time" type="number" min="1" max="300" value="20" inputmode="numeric" />
            <span>sekunder</span>
          </div>
        </div>

        <div class="sequence" aria-label="Kommandosekvens">
          <span>10 sekunder kvar</span>
          <span>Färdiga</span>
          <span>Eld</span>
          <span>Eld upphör</span>
        </div>

        <button class="start-button" type="button">Starta</button>
        <p class="status" aria-live="polite">Klar att starta.</p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
